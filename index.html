<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisBible — 聖經視覺化</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #f8f6f1;
            --card-bg: #fff;
            --accent: #8b6914;
            --accent-light: #c9a227;
            --text: #2c2c2c;
            --text-muted: #5c5c5c;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --radius: 12px;
        }

        body {
            font-family: 'Noto Sans TC', 'Microsoft YaHei', '微軟正黑體', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
        }

        .page {
            max-width: 900px;
            margin: 0 auto;
            padding: 48px 24px 64px;
            flex: 1;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 56px;
        }

        .logo {
            font-family: 'Noto Serif TC', serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.02em;
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 1.05rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .section-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--accent-light);
        }

        .cards {
            display: grid;
            gap: 24px;
        }

        .card {
            display: block;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 28px 32px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid rgba(139, 105, 20, 0.12);
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(0,0,0,0.12);
        }

        .card-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .card-desc {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .card-meta {
            font-size: 0.85rem;
            color: var(--accent-light);
        }

        /* Footer - 與 KingsTimeline 一致 */
        .footer {
            background: var(--bg);
            color: var(--text-muted);
            padding: 32px 20px 20px 20px;
            margin-top: 56px;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .footer-section {
            margin-bottom: 15px;
            max-width: 430px;
        }

        .footer-section h4 {
            font-family: 'Noto Serif TC', serif;
            font-size: 1em;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text);
        }

        .footer-section p {
            font-size: 0.9em;
            line-height: 1.6;
            color: var(--text-muted);
        }

        .footer-section a {
            color: var(--accent);
            text-decoration: none;
        }

        .footer-section a:hover {
            color: var(--accent-light);
            text-decoration: underline;
        }

        .footer-divider {
            width: 60%;
            height: 1px;
            background: rgba(139, 105, 20, 0.2);
            margin: 15px 0;
        }

        @media (min-width: 768px) {
            .footer-content {
                flex-direction: row;
                justify-content: space-around;
                align-items: flex-start;
            }

            .footer-divider {
                display: none;
            }
        }

        @media (max-width: 767px) {
            .footer-content { align-items: flex-start; }
            .footer-section { text-align: left; }
        }
    </style>
</head>
<body>
    <div class="page">
        <header>
            <h1 class="logo">VisBible</h1>
            <p class="tagline">VisBible · 以視覺方式探索聖經</p>
        </header>

        <section>
            <h2 class="section-title">專案</h2>
            <div class="cards">
                <a href="KingsTimeline/" class="card">
                    <h3 class="card-title">聖經君王時序</h3>
                    <p class="card-desc">以時間軸視覺化呈現以色列與猶大諸王的在位年代，以及同期先知，方便對照經文與歷史脈絡。</p>
                    <span class="card-meta">前往時間軸 →</span>
                </a>
            </div>
        </section>

    </div>

    <!-- Footer - 與 KingsTimeline 一致 -->
    <div class="footer">
        <div class="footer-content">
            <div class="footer-section">
                <h4>📩 聯絡資訊</h4>
                <p>Email: <a href="mailto:visbible.org@gmail.com">visbible.org@gmail.com</a></p>
            </div>

            <div class="footer-divider"></div>

            <div class="footer-section">
                <h4>ℹ︎ 關於</h4>
                <p>這是幫助理解聖經歷史的視覺化工具，由 <a href="https://alicehsu.blog/zh-tw/about" target="_blank" rel="noopener noreferrer">Alice Hsu</a> 與 <a href="https://mhyeh.github.io" target="_blank" rel="noopener noreferrer">Samuel Yeh</a> 基督徒夫婦共同製作，若有任何問題或建議，歡迎來信。</p>
            </div>

            <div class="footer-divider"></div>

            <div class="footer-section">
                <h4>© 版權</h4>
                <p>© 2026 VisBible.org 保留所有權利</p>
            </div>
        </div>
    </div>
</body>
</html>
